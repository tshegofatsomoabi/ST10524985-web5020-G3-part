<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Enquiry - Hope Haven Animal Rescue</title>
</head>
<body>
    <header>
        <h1>Hope Haven Animal Rescue</h1>
        <nav>
            <a href="index.html">Home</a> |
            <a href="about.html">About Us</a> |
            <a href="services.html">Services</a> |
            <a href="enquiry.html">Enquiry</a> |
            <a href="contact.html">Contact</a>
        </nav>
    </header>

    <main>
        <h2>Make an Enquiry</h2>

        <form>
            <label for="name">Full Name:</label><br>
            <input type="text" id="name" name="name"><br><br>

            <label for="email">Email:</label><br>
            <input type="email" id="email" name="email"><br><br>

            <label for="type">Enquiry Type:</label><br>
            <select id="type" name="type">
                <option>Adoption</option>
                <option>Fostering</option>
                <option>Volunteering</option>
                <option>Donation</option>
                <option>Animal Rescue</option>
            </select><br><br>

            <label for="message">Message:</label><br>
            <textarea id="message" name="message" rows="6" cols="40"></textarea><br><br>

            <input type="submit" value="Submit Enquiry">
        </form>
    </main>

    <footer>
        <p>&copy; 2026 Hope Haven Animal Rescue</p>
    </footer>
</body>
</html>
